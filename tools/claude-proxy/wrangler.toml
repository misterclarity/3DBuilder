# Cloudflare Worker config for the DIY Workshop Claude demo proxy.
# This file is safe to commit — it holds NO secrets. Both the Anthropic API key
# and the demo URL token are stored as Cloudflare secrets, not here:
#   cd tools/claude-proxy && npx wrangler deploy
#   npx wrangler secret put ANTHROPIC_API_KEY     # paste your sk-ant-... key
#   npx wrangler secret put DEMO_TOKEN            # the unguessable part of the demo URL

name = "diyw-claude-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

# DEMO_TOKEN is a SECRET (set with `wrangler secret put DEMO_TOKEN`), not a var —
# it is the unguessable token in https://…workers.dev/t/<DEMO_TOKEN>. Keeping it
# out of this file means it never lands in the public repo. An ASCII-only token
# is recommended for clean shareable links (non-ASCII works but percent-encodes).

[vars]
# Lock requests to your GitHub Pages origin (recommended), e.g. "https://you.github.io".
# Empty = any origin may call the proxy (only the token protects it).
ALLOWED_ORIGIN = ""

# Models offered in the app's model dropdown; first entry is the default.
MODELS = "claude-opus-4-8,claude-sonnet-5,claude-haiku-4-5"

# Reasoning depth for Opus/Sonnet: low | medium | high | xhigh | max.
# "xhigh" = deep reasoning (the setting Claude Code uses for hard work); best
# design quality, slower and more tokens. Drop to "high" if turns feel too slow.
# Ignored by Haiku.
EFFORT = "xhigh"

# Best-effort per-day request cap (per worker isolate). The hard spend guard is
# your Anthropic Console workspace spend limit / prepaid credits.
DAILY_LIMIT = "400"

# Upper bound for max_tokens forwarded to the API.
MAX_TOKENS_CAP = "64000"
